<style>
  html{scroll-behavior:smooth}

  [x-cloak]{display:none!important}
  .fade-in{animation:fadeIn .4s ease both}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .skeleton{background:linear-gradient(90deg,#f5f5f4 25%,#e7e5e4 37%,#f5f5f4 63%);background-size:400% 100%;animation:sk 1.2s infinite}
  @keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
  input,select,textarea{outline:none}
  input:focus,select:focus,textarea:focus{border-color:#ea580c;box-shadow:0 0 0 3px rgba(234,88,12,.12)}

  .switch{position:relative;width:40px;height:22px;background:#d6d3d1;border-radius:999px;transition:.2s;cursor:pointer}
  .switch.on{background:#ea580c}
  .switch::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch.on::after{left:20px}
  .tab-active{color:#1c1917;border-color:#ea580c}
  .nav-link{position:relative}
  .nav-link::after{content:'';position:absolute;left:0;right:0;bottom:-2px;height:2px;background:#ea580c;transform:scaleX(0);transform-origin:left;transition:.2s}

const $ = (s, r=document)=>r.querySelector(s);
const money = n => '₹'+n.toLocaleString('en-IN');
const discount = p => Math.round((p.mrp-p.price)/p.mrp*100);

function toast(msg){
  const t = $('#toast'); $('#toastMsg').textContent = msg;
  t.classList.remove('hidden'); t.classList.add('fade-in');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.add('hidden'),2200);
}

function ratingStars(r, size='w-3.5 h-3.5'){
  let s=''; const full=Math.floor(r);
  for(let i=0;i<5;i++){
    s += `<svg class="${size} ${i<full?'text-brand-500':'text-ink-300'}" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.7 5.6 6 .9-4.3 4.2 1 6L12 17.8 6.6 19.7l1-6L3.3 9.5l6-.9z"/></svg>`;
  }
  return `<span class="inline-flex items-center gap-0.5">${s}</span>`;
}

function cartCount(){ return state.cart.reduce((a,c)=>a+c.qty,0); }
function wishCount(){ return state.wishlist.length; }

function addToCart(id){
  const ex = state.cart.find(c=>c.id==id);
  if(ex) ex.qty++; else state.cart.push({id, qty:1});
  toast('Added to cart'); renderHeader();
}
function updateQty(id, d){
  const c = state.cart.find(c=>c.id==id); if(!c) return;
  c.qty += d; if(c.qty<=0) state.cart = state.cart.filter(x=>x.id!=id);
  renderHeader(); if(location.hash.startsWith('#/cart')) router();
  if(location.hash.startsWith('#/checkout')) router();
}
function removeCart(id){ state.cart = state.cart.filter(c=>c.id!=id); toast('Removed from cart'); renderHeader(); router(); }
function toggleWish(id){
  const i = state.wishlist.indexOf(id);
  if(i>=0){state.wishlist.splice(i,1); toast('Removed from wishlist');} else {state.wishlist.push(id); toast('Added to wishlist');}
  renderHeader(); router();
}
function cartTotal(){ return state.cart.reduce((a,c)=>a+prod(c.id).price*c.qty,0); }
function deliveryCharge(){
  const t = cartTotal();
  if(t===0) return 0;
  return t>=499 ? 0 : 49;
}

/* ============================================================
   ROUTER
============================================================ */
function parseHash(){
  let h = location.hash.replace(/^#/,'') || '/';
  const [path, query] = h.split('?');
  const seg = path.split('/').filter(Boolean);
  const q = {};
  if(query) query.split('&').forEach(p=>{const [k,v]=p.split('=');q[k]=decodeURIComponent(v||'');});
  return {seg, q};
}

function router(){
  $('#siteFooter').style.display = (location.hash.startsWith('#/seller')||location.hash.startsWith('#/admin')) ? 'none':'';
  if(state.loading){ $('#view').innerHTML = renderSkeleton(); state.loading=false; }
  const {seg, q} = parseHash();
  const route = seg[0] || '';
  window.scrollTo(0,0);
  renderHeader();
  if(route==='') homeView();
  else if(route==='products') productsView(q);
  else if(route==='product') productView(seg[1]);
  else if(route==='cart') cartView();
  else if(route==='checkout') checkoutView();
  else if(route==='orders') ordersView(seg[1]);
  else if(route==='profile') profileView(q.tab);
  else if(route==='wishlist') wishlistView();
  else if(route==='seller') sellerView(seg[1]||'dashboard');
  else if(route==='admin') adminView(seg[1]||'dashboard');
  else notFound();
}

function applyFilters(list, q){
  let arr = [...list];
  if(q.cat){ state.filters.cat=[q.cat]; }
  if(q.deals){ arr = arr.filter(p=>discount(p)>=20); }
  if(state.search){ const s=state.search.toLowerCase(); arr=arr.filter(p=>p.name.toLowerCase().includes(s)||p.brand.toLowerCase().includes(s)||catName(p.cat).toLowerCase().includes(s)); }
  if(state.filters.cat.length) arr=arr.filter(p=>state.filters.cat.includes(p.cat));
  arr = arr.filter(p=>p.price>=state.filters.minPrice && p.price<=state.filters.maxPrice);
  if(state.filters.rating) arr=arr.filter(p=>p.rating>=state.filters.rating);
  const s = state.filters.sort;
  if(s==='price_asc') arr.sort((a,b)=>a.price-b.price);
  else if(s==='price_desc') arr.sort((a,b)=>b.price-a.price);
  else if(s==='rating') arr.sort((a,b)=>b.rating-a.rating);
  else if(s==='newest') arr.sort((a,b)=>b.id-a.id);
  return arr;
}

function miniChart(data,wide=false){

}

  if(tab==='complaints') return `<div class="bg-white border border-ink-200 rounded-2xl p-5"><h3 class="font-bold mb-4">Customer Complaints</h3><div class="space-y-3">${[['C-2931','Late delivery','Order AB10694','High','Resolved'],['C-2930','Wrong product','Order AB10702','Medium','Open'],['C-2929','Refund issue','Order AB10688','High','In Progress'],['C-2928','Damaged item','Order AB10679','Low','Resolved']].map(c=>`<div class="p-4 rounded-xl border border-ink-200 flex flex-wrap items-center justify-between gap-3"><div><div class="flex items-center gap-2"><span class="font-bold text-sm">#${c[0]}</span><span class="text-xs text-ink-500">${c[1]}</span></div><div class="text-xs text-ink-500 mt-1">${c[2]}</div></div><div class="flex items-center gap-2"><span class="text-[10px] font-bold px-2 py-1 rounded ${c[3]==='High'?'bg-red-100 text-red-700':c[3]==='Medium'?'bg-brand-100 text-brand-700':'bg-ink-100 text-ink-600'}">${c[3]} priority</span><span class="text-[11px] font-bold px-2 py-1 rounded ${c[4]==='Resolved'?'bg-green-100 text-green-700':c[4]==='In Progress'?'bg-brand-100 text-brand-700':'bg-ink-100 text-ink-700'}">${c[4]}</span><button onclick="toast('Opening ${c[0]}')" class="text-xs font-semibold text-brand-700">Investigate →</button></div></div>`).join('')}</div></div>`;
  if(tab==='approvals') return `<div class="grid lg:grid-cols-2 gap-4"><div class="bg-white border border-ink-200 rounded-2xl p-5"><h3 class="font-bold mb-4 flex items-center gap-2">${icon('users','w-5 h-5 text-brand-600')} Seller Approvals (2)</h3><div class="space-y-3">${sellers.filter(s=>s.status==='pending').concat(sellers.slice(0,1)).slice(0,2).map(s=>`<div class="p-4 rounded-xl border border-ink-200"><div class="flex items-center gap-3 mb-2"><div class="w-10 h-10 rounded-lg bg-ink-100 flex items-center justify-center font-bold">${s.name.slice(0,1)}</div><div><div class="font-semibold text-sm">${s.name}</div><div class="text-xs text-ink-500">${s.location} · GST: 29ABCDE${s.id}1Z5</div></div></div><div class="flex gap-2 mt-2"><button onclick="toast('${s.name} approved')" class="flex-1 h-9 bg-green-600 text-white text-xs font-bold rounded-lg">Approve</button><button onclick="toast('Rejected')" class="flex-1 h-9 border border-ink-200 text-xs font-bold rounded-lg">Reject</button><button class="h-9 px-3 border border-ink-200 text-xs font-semibold rounded-lg">Review</button></div></div>`).join('')}</div></div><div class="bg-white border border-ink-200 rounded-2xl p-5"><h3 class="font-bold mb-4 flex items-center gap-2">${icon('package','w-5 h-5 text-brand-600')} Product Approvals (1)</h3><div class="space-y-3"><div class="p-4 rounded-xl border border-ink-200"><div class="flex gap-3"><div class="w-14 h-14 rounded-lg overflow-hidden border border-ink-100">${productImg(P[0])}</div><div class="flex-1"><div class="font-semibold text-sm">${P[0].name}</div><div class="text-xs text-ink-500">by TechWorld India</div><div class="text-xs text-ink-500 mt-1">Price: ${money(P[0].price)} · Cat: ${catName(P[0].cat)}</div></div></div><div class="flex gap-2 mt-3"><button onclick="toast('Product approved')" class="flex-1 h-9 bg-green-600 text-white text-xs font-bold rounded-lg">Approve</button><button onclick="toast('Product rejected')" class="flex-1 h-9 border border-ink-200 text-xs font-bold rounded-lg">Reject</button></div></div><div class="text-center text-sm text-ink-500 py-6 border-2 border-dashed border-ink-200 rounded-xl">No more products awaiting approval</div></div></div></div>`;
  if(tab==='analytics') return `<div class="grid lg:grid-cols-2 gap-4"><div class="bg-white border border-ink-200 rounded-2xl p-5"><h3 class="font-bold mb-4">Annual Revenue</h3>${miniChart([42,48,52,58,61,55,68,72,78,82,88,94],true)}</div><div class="bg-white border border-ink-200 rounded-2xl p-5"><h3 class="font-bold mb-4">Revenue by Category</h3><div class="space-y-3">${categories.map((c,i)=>{const w=85-i*8;return `<div><div class="flex justify-between text-xs mb-1"><span class="font-medium">${c.name}</span><span class="text-ink-500">${money(1200000-i*95000)}</span></div><div class="h-2 bg-ink-100 rounded-full overflow-hidden"><div class="h-full bg-brand-500" style="width:${w}%"></div></div></div>`}).join('')}</div></div><div class="bg-white border border-ink-200 rounded-2xl p-5 lg:col-span-2"><h3 class="font-bold mb-4">Key Metrics</h3><div class="grid grid-cols-2 md:grid-cols-4 gap-4">${[['Gross Merchandise Value','₹84.2L'],['Platform Commission','₹4.2L'],['Avg Order Value','₹6,560'],['Repeat Customer Rate','68%'],['New Customers','4,820'],['Refund Rate','2.4%'],['Active Sellers','15,240'],['Customer Satisfaction','4.5 ★']].map(([l,v])=>`<div class="p-4 rounded-xl bg-ink-50"><div class="text-xs text-ink-500">${l}</div><div class="font-extrabold text-lg mt-1">${v}</div></div>`).join('')}</div></div></div>`;
  return adminContent('dashboard');
}

function renderSkeleton(){
  return `<div class="max-w-7xl mx-auto px-4 py-6"><div class="grid grid-cols-2 md:grid-cols-4 gap-4">${Array(8).fill(0).map(()=>`<div class="rounded-2xl border border-ink-100 overflow-hidden"><div class="aspect-square skeleton"></div><div class="p-3 space-y-2"><div class="h-3 w-3/4 skeleton rounded"></div><div class="h-3 w-1/2 skeleton rounded"></div><div class="h-6 w-2/3 skeleton rounded"></div></div></div>`).join('')}</div></div>`;
}
